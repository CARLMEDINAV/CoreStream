services:
  postgres:
    image: postgres:15
    container_name: corestream-postgres
    environment:
      POSTGRES_DB: corestream
      POSTGRES_USER: corestream
      POSTGRES_PASSWORD: corestream
    volumes:
    - postgres-data:/var/lib/postgresql/data
    network_mode: host
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U corestream
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    container_name: corestream-redis
    network_mode: host
    command: redis-server --appendonly yes
    volumes:
    - redis-data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    container_name: corestream-backend
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
    - ./backend/.env
    volumes:
    - ./backend:/app
    - storage-documents:/app/storage/documents
    command: 'sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port
      8000 --reload --reload-dir /app"

      '
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      network: host
    container_name: corestream-frontend
    depends_on:
    - backend
    volumes:
    - ./frontend:/app
    - /app/node_modules
    network_mode: host
    command: npm run dev -- --host 0.0.0.0
    restart: unless-stopped
    env_file:
    - ./frontend/.env
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    container_name: corestream-worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
    - ./backend/.env
    volumes:
    - ./backend:/app
    network_mode: host
    command: python -m arq app.worker.settings.WorkerSettings
    restart: unless-stopped
volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  storage-documents:
    driver: local
